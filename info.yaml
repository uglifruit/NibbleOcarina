summary: |
  Turns the Workshop System's four buttons into the finger holes of a flute you
  blow with a knob.<br><br>

  Patch one output of the FOUR VOLTAGES module into CV In 1, teach the card
  which voltage each button combination produces, and its buttons become
  fingerings. The Main knob is your breath - turn it up and the instrument
  speaks, turn it down and it stops. Blow hard and it jumps the octave.<br><br>

  The tone is a pure sine and the expression is VIBRATO. Turn the Main knob up
  and it comes quickly to full volume; keep going and vibrato grows on top - so
  a phrase moves from quiet and steady, through loud and steady, into loud and
  singing. X decides what kind of vibrato, morphing from fast and wide, through
  fast and tight, to slow and wide, while also tilting the level a little and
  opening a wavefolder on Audio Out 2. In tune to under a cent across four and
  a half octaves.<br><br>

  THREE OUTPUTS, ONE OSCILLATOR - Audio Out 1 is the sine, Audio Out 2 the same
  wave folded, Pulse Out 2 the same wave squared. All identical in pitch and
  phase, so they mix without comb filtering and the square always lines up.
  CV Out 1 carries the pitch INCLUDING the vibrato, and CV Out 2 the level, so
  the rest of the rack can follow exactly what is being heard.<br><br>

  SETUP - patch one Four Voltages output into CV In 1. That is the whole
  required patch. Calibration starts by itself at power-on - hold each
  combination the LEDs ask for and tap the switch. Re-calibrate whenever you
  move the Four Voltages knob, since it moves every voltage at once.<br><br>

  SILENCE IS THE KNOB, NOT THE FINGERING - and that is forced by the hardware
  rather than chosen. Four Voltages has no rest voltage - let go of every button
  and the output stays where it was, so "no holes covered" is not a state it can
  express and cannot mean silence. On a real ocarina you stop by not blowing,
  which is exactly what the Main knob does here.<br><br>

  RELEASING A FINGER IS A NOTE - come off A+B onto A and you hear A. That is
  what makes trilling work - hold one hole, waggle another, and you get a clean
  alternation up to about sixteen a second. Switch UP is the trill mode - it
  glides between the two pitches instead of articulating each one.<br><br>

  TEN COMBINATIONS - four singles and six pairs. Four buttons can express
  fifteen, and the card used to walk all fifteen and work out at the end whether
  the resistor network separated them well enough to use. Fifteen turned out to
  be simply too many to play: the triples are awkward fingerings whatever the
  voltages do. Pressing three or four buttons is SAFE rather than merely unused
  - those voltages land far from every learned level, so the card ignores them
  and holds the note you were already playing.<br><br>

  TUNING AND OCTAVE HAPPEN DURING CALIBRATION - a quiet reference note drones
  for the whole of it, and all three knobs shape that note while you teach the
  fingering. Y is coarse tune in semitones, Main is fine tune in cents, and X
  picks the OCTAVE from C2 to C5. Calibration itself only reads CV In 1 and the
  switch, so the knobs are free and neither job costs the other anything. The
  default is C4, a concert flute's lowest note. Nothing is saved to flash - not
  the tuning and not the calibration, and a power cycle means calibrating again
  anyway, which is when you retune.<br><br>

  ON HONESTY - v1 of this card was a jet-driven waveguide, a genuine physical
  model. It had a bug: the jet's feedback term did not depend on breath, so the
  bore drove itself, the card never went silent, the knob spanned barely any
  loudness at all and the runaway saturated into a metallic spectrum. The jet
  could not be repaired without it choosing its own pitch, so it was replaced.
  What is here now is an oscillator, filtered noise, a resonant body and a
  breath VCA - a synthesiser shaped to sound like a flute rather than a
  simulation of one. The octave jump is likewise explicit rather than emergent.
  It sounds like a wind instrument and it always plays in tune, which matters
  more than the label.

panel:
  inputs:
    - id: CVIn1
      name: Four Voltages
      type: cv
      description: Patch one output of the Four Voltages module here. This is the fingering. The card learns which voltage each button combination produces, so it works at any position of the Four Voltages knob - re-learn whenever you move it. It also measures how well separated the combinations are and tells you, rather than guessing.
    - id: CVIn2
      name: Pitch offset
      type: cv
      description: Transposes the whole instrument, up to two octaves either way. Quantised to whole semitones on purpose - an imprecise voltage should move things by a musical interval rather than leaving everything slightly sharp. Only active when something is actually patched.
    - id: AudioIn1
      name: Main offset
      type: audio
      description: Used as a CV rather than as audio - it offsets the Main knob, so an envelope or LFO can play the level and the vibrato. Doubled on the way in, because the audio inputs are half the range of the knobs, so a full-scale CV can sweep the knob end to end from either extreme. Only active when something is patched.
    - id: AudioIn2
      name: X offset
      type: audio
      description: Used as a CV rather than as audio - it offsets the X knob, so the vibrato character, the level tilt and the wavefold can all be modulated together. Same doubling as Audio In 1, and likewise only active when something is patched.
    - id: PulseIn1
      name: Tongue
      type: pulse
      description: Re-articulates the current note without changing the fingering, which is how you play repeated notes on one hole. Fires a chiff in tongued articulation; in legato it is deliberately ignored, because a slur that re-articulates is not a slur.
    - id: PulseIn2
      name: Unused
      type: pulse
      description: Not used in this version.
  outputs:
    - id: CVOut1
      name: Pitch
      type: cv
      description: "Calibrated 1V/oct pitch. The root of the scale is 0V, so an oscillator sitting at its own zero is already in tune. It follows everything the internal voice does - the fine tune, the vibrato, the octave jump, and the glide during a legato slur, which slides rather than stepping. The two are computed from the same numbers precisely so they cannot disagree."
    - id: CVOut2
      name: Level
      type: cv
      description: The level as a control voltage, 0 to 5V, after the knob curve, after X's tilt and after the articulation dip - so it tracks exactly what you are hearing rather than just where the knob is. The obvious patch is into a filter or VCA so something else in the rack follows the phrasing.
    - id: AudioOut1
      name: Flute
      type: audio
      description: The instrument - a pure sine at the fingered pitch, carrying the vibrato, scaled by the level. Range is C2 to G6, four and a half octaves, in tune to under a cent throughout. Deliberately plain - the expression here is the vibrato and the phrasing, not the timbre, and Audio Out 2 is where the harmonic interest lives.
    - id: AudioOut2
      name: Wavefold
      type: audio
      description: The SAME oscillator as Audio Out 1, wavefolded - a triangle reflection that adds a pair of odd harmonics per fold, so it thickens into something reedy rather than into fuzz. X sets the depth, from identical to Audio Out 1 at fully anticlockwise to hollow and third-heavy at clockwise. Because both outputs share one oscillator they are always at the same pitch and phase, so mixing or crossfading between them cannot comb filter.
    - id: PulseOut1
      name: Note trigger
      type: pulse
      description: A short blip every time the fingering changes, and on a tongue from Pulse In 1. A trigger rather than a gate, so envelopes elsewhere in the rack fire in time with the card's own note changes.
    - id: PulseOut2
      name: Square
      type: pulse
      description: The same oscillator as the two audio outputs, as a square wave - so it is an audio-rate signal at the fingered pitch rather than a control pulse. Taken from the oscillator's sign rather than from the level-scaled audio, so it stays clean as the level approaches silence instead of chattering around zero.

controls:
  switch:
    up:
      name: Legato
      description: "Glide between notes instead of stepping, with a gentle vibrato of about fifteen cents at five hertz. No chiff. This is the trill mode - under tongued articulation a fast trill fires a chiff per note and becomes a stutter, whereas legato slides between the two pitches, which is what a trill actually sounds like on a wind instrument. HOLD for one second to see how close the last calibration came to fifteen combinations; keep holding to three seconds to enter tuning."
    middle:
      name: Tongued
      description: Every new fingering starts with a chiff - a short burst of extra noise and a momentary dip in the air, which is physically what a tongue stroke does. This is what makes repeated notes articulate rather than smear into one another. There is a minimum interval between chiffs, so ordinary playing articulates every note while a deliberate trill smooths into a single gesture.
    down:
      name: Chiff stop / Calibrate
      description: "Momentary mute, and a real stop rather than a gate close - it cuts the air AND damps the bore, so the sound ends in about fifty milliseconds instead of ringing out. Use it to cut a phrase or play hard staccato; releasing it re-attacks cleanly. HOLD for two seconds to calibrate, from anywhere including mid-announcement, which matters because hunting for a fifteen-combination calibration means doing it repeatedly. How it ends is on the LEDs: LEDs fading with both bottom lights blinking three times means all fifteen are usable; a four-LED bar with one long blink means it fell back to ten and the bar says how close it came; the two COLUMNS alternating fast means it FAILED, which in practice means nothing is patched into CV In 1 - the previous calibration is kept either way."
    tap:
      name: Capture / Leave tune
      description: During calibration, captures the combination you are holding - a tap while the voltage is still moving is rejected with a flash rather than silently recording a mid-slew reading. In tuning, leaves and keeps whatever offsets you have set. In normal play it does nothing, since the chiff stop is the momentary action and re-articulation lives on Pulse In 1.
  knobs:
    -
      main:
        name: Breath
        description: "The card's only way to be silent - below about seven percent of travel the instrument does not sound at all. It does two things in sequence: level rises FAST and is nearly full by half the travel, the way ears actually hear loudness, and past that point the knob stops adding volume and starts adding VIBRATO instead. So the bottom half is how loud and the top half is how much it sings, and a phrase can move from quiet and steady through loud and steady into loud and singing on one control. The octave jump sits around seventy percent, with a hysteresis band so it cannot flutter. DURING CALIBRATION this becomes fine tune, plus or minus one hundred cents."
      x:
        name: Timbre
        description: "What KIND of vibrato the Main knob adds, morphing through three characters: fully anticlockwise is fast and wide (8Hz, 50 cents) which is dramatic, the centre is fast and tight (8Hz, 10 cents) which is nervous and close, and fully clockwise is slow and wide (3Hz, 50 cents) which is operatic. Turning it up also tilts the level a little and opens the wavefolder on Audio Out 2, so the clockwise end is slower-vibrato, slightly louder and more harmonically complex at once. The fold deliberately stops at half its available range - past that point the harmonics dip before rising again, and a knob that gets brighter then duller reads as broken."
      y:
        name: Scale
        description: "One of twelve scales, ordered dark to bright from fully anticlockwise, shown as a bar on the LEDs while you turn it: Phrygian, Hirajoshi, Harmonic Minor, Natural Minor, Minor Pentatonic, m7 Arpeggio, Dorian, Major Pentatonic, Ionian (Major), Maj7 Arpeggio, Whole Tone, Chromatic. Because the combinations are DEGREES rather than pitches, the scale also sets the range - a four-note arpeggio spreads them over three octaves while Chromatic packs them into just over one. The two arpeggios are wider than the bore can reach, so their top degree or two repeat the highest note rather than going out of tune. In TUNING this becomes coarse tune, plus or minus twelve semitones."
  leds:
    -
      display: list
      items:
        - id: LED0-3
          description: "In play, the fingering you are holding - the 2x2 block is laid out like the Four Voltages buttons, so the panel mirrors your fingers. During calibration, the combination to hold next, blinking, with already-visited buttons glowing dimly. After a fall back to ten, a four-LED bar showing how close the patch came to fifteen."
        - id: LED4
          description: "In play, a breath meter. During calibration, part of the phase marker - lit for singles, lit with LED 5 for triples, blinking fast with it for all four, so more light means more fingers."
        - id: LED5
          description: "In play, the mode indicator - dimly lit means all fifteen combinations are live, dark means ten. This is the one thing worth knowing mid-performance, because it tells you whether a third finger does anything. During calibration it marks pairs."
